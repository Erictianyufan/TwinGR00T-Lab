[[package]]
name = "twingr00t-lab"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "numpy", version = "2.4.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.12'" },
    { name = "numpy", version = "2.5.2", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.12'" },
]

[package.optional-dependencies]
bridge = [
    { name = "msgpack" },
    { name = "msgpack-numpy" },
    { name = "pyzmq" },
]
data = [
    { name = "h5py" },
    { name = "pillow" },
    { name = "pyarrow" },
]
dev = [
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "h5py", marker = "extra == 'data'", specifier = ">=3.11" },
    { name = "msgpack", marker = "extra == 'bridge'", specifier = ">=1.1" },
    { name = "msgpack-numpy", marker = "extra == 'bridge'", specifier = ">=0.4.8" },
    { name = "numpy", specifier = ">=1.26" },
    { name = "pillow", marker = "extra == 'data'", specifier = ">=10" },
    { name = "pyarrow", marker = "extra == 'data'", specifier = ">=17" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8" },
    { name = "pyzmq", marker = "extra == 'bridge'", specifier = ">=26" },
    { name = "ruff", marker = "extra == 'dev'", specifier = ">=0.9" },
]
provides-extras = ["dev", "data", "bridge"]
